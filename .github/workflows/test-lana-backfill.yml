name: Test Lana 4.0.0 tap candidate

on:
  push:
    branches: [tap-test/lana-4.0.0]

jobs:
  source-install:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          brew tap --custom-remote oponite/lana-candidate "$GITHUB_WORKSPACE"
          brew trust --formula oponite/lana-candidate/lana
          brew audit --strict --formula oponite/lana-candidate/lana
          brew install --build-from-source oponite/lana-candidate/lana
          brew test oponite/lana-candidate/lana
          "$(brew --prefix oponite/lana-candidate/lana)/bin/lana" version | grep -F 'Lana 4.0.0 (LABC v2,'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
